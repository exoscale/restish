name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Run integration tests
        run: go test -tags=integration ./...

      - name: Build binaries
        run: |
          go build ./cmd/restish
          go build ./cmd/restish-bulk
          go build ./cmd/restish-csv
          go build ./cmd/restish-mcp
          go build ./cmd/restish-pkcs11

      - name: Build Windows CLI
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/restish.exe" ./cmd/restish

  docs:
    name: Docs
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: "0.160.0"
      NODE_VERSION: "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${HOME}/.local/hugo"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Install Node.js dependencies
        working-directory: site
        run: npm ci

      - name: Check generated docs
        run: go run ./cmd/restish-docgen --check

      - name: Generate social preview images
        run: npm run social-images

      - name: Build docs site
        run: |
          hugo --source site --quiet --gc --minify \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Check docs links
        run: scripts/check-doc-links.rb

      - name: Check docs examples
        run: scripts/check-doc-examples.rb
