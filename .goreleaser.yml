version: 2

project_name: restish

release:
  github:
    owner: natalie-o-perret
    name: restish
  prerelease: auto

before:
  hooks:
    - go mod download

builds:
  - id: restish
    main: ./cmd/restish
    binary: restish
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rest-sh/restish/v2/internal/cli.Version={{ .Version }}

  - id: restish-bulk
    main: ./cmd/restish-bulk
    binary: restish-bulk
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: restish-csv
    main: ./cmd/restish-csv
    binary: restish-csv
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: restish-mcp
    main: ./cmd/restish-mcp
    binary: restish-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: restish-pkcs11-darwin-amd64
    main: ./cmd/restish-pkcs11
    binary: restish-pkcs11
    goos:
      - darwin
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++

  - id: restish-pkcs11-darwin-arm64
    main: ./cmd/restish-pkcs11
    binary: restish-pkcs11
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++

  - id: restish-pkcs11-linux-amd64
    main: ./cmd/restish-pkcs11
    binary: restish-pkcs11
    goos:
      - linux
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++

  - id: restish-pkcs11-linux-arm64
    main: ./cmd/restish-pkcs11
    binary: restish-pkcs11
    goos:
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++

  - id: restish-pkcs11-windows-amd64
    main: ./cmd/restish-pkcs11
    binary: restish-pkcs11
    goos:
      - windows
    goarch:
      - amd64
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++

archives:
  - id: restish
    ids:
      - restish
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: restish-bulk
    ids:
      - restish-bulk
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: restish-csv
    ids:
      - restish-csv
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: restish-mcp
    ids:
      - restish-mcp
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: restish-pkcs11
    ids:
      - restish-pkcs11-darwin-amd64
      - restish-pkcs11-darwin-arm64
      - restish-pkcs11-linux-amd64
      - restish-pkcs11-linux-arm64
      - restish-pkcs11-windows-amd64
    name_template: "{{ .Binary }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
